<ion-header class="ion-no-border places-header">
  <ion-toolbar>
    <ion-title>Puntos de Interés</ion-title>
  </ion-toolbar>

  <div class="search-filter-wrapper">
    <div class="search-box">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input
        type="text"
        [(ngModel)]="filtroTexto"
        placeholder="Buscar estadio, parque, museo..."
        class="search-input"
      />
      <button *ngIf="filtroTexto" class="clear-search-btn" (click)="filtroTexto = ''">
        &times;
      </button>
    </div>

    <div class="chips-scroll">
      <button
        *ngFor="let cat of categorias"
        class="filter-chip"
        [class.active]="categoriaActiva === cat"
        (click)="setCategoria(cat)"
      >
        {{ cat === 'Todos' ? 'Todos (' + puntos.length + ')' : cat.replace('_', ' ') }}
      </button>
    </div>
  </div>
</ion-header>

<ion-content class="places-content ion-padding">
  <div class="poi-grid" *ngIf="puntosFiltrados.length > 0">
    <div
      *ngFor="let punto of puntosFiltrados"
      class="poi-card"
      (click)="irAlMapa(punto.lat, punto.lng)"
    >
      <div class="poi-icon-box">
        <span class="poi-emoji">{{ obtenerEmoji(punto.tipo) }}</span>
      </div>

      <div class="poi-info">
        <h3 class="poi-title">{{ punto.nombre }}</h3>
        <span class="poi-category">{{ punto.tipo.replace('_', ' ') }}</span>
        <span class="poi-coords">📍 {{ punto.lat | number:'1.3-3' }}, {{ punto.lng | number:'1.3-3' }}</span>
      </div>

      <button class="btn-poi-route" title="Cómo llegar">
        <ion-icon name="navigate-outline"></ion-icon>
      </button>
    </div>
  </div>

  <div *ngIf="puntosFiltrados.length === 0" class="empty-state">
    <div class="empty-icon-circle">
      <ion-icon name="search-outline"></ion-icon>
    </div>
    <h3 class="empty-title">No se encontraron lugares</h3>
    <p class="empty-subtitle">Intenta buscar con otra palabra clave o selecciona "Todos".</p>
  </div>
</ion-content>
